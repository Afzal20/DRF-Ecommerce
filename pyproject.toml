[project]
name = "drf-ecommerce"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asgiref>=3.12.1",
    "certifi>=2026.7.22",
    "cffi>=2.1.1",
    "charset-normalizer>=3.5.1",
    "coreapi>=2.3.3",
    "coreschema>=0.0.4",
    "cryptography>=50.0.1",
    "django>=6.1",
    "django-cors-headers>=4.9.0",
    "django-countries>=9.0.0",
    "django-rest-swagger>=2.2.0",
    "django-swagger-ui>=0.1.11",
    "djangorestframework>=3.18.0",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-yasg>=1.21.15",
    "google-auth>=2.57.0",
    "groq>=1.7.0",
    "idna>=3.19",
    "inflection>=0.5.1",
    "itypes>=1.2.0",
    "jinja2>=3.1.6",
    "markupsafe>=3.0.3",
    "openapi-codec>=1.3.2",
    "packaging>=26.3",
    "pillow>=12.3.0",
    "pycparser>=3.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    "pytz>=2026.3.post1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "simplejson>=4.1.2",
    "sqlparse>=0.6.0",
    "stripe>=15.6.0",
    "typing-extensions>=4.16.0",
    "tzdata>=2026.3",
    "uritemplate>=4.2.0",
    "urllib3>=2.7.0",
    "uv>=0.12.8",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "factory-boy>=3.3.3",
    "isort>=9.0.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.5",
]
[tool.isort]
profile = "black"
